<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f4f8f9; color: #16323a; font-family: "Nunito", "Segoe UI", sans-serif;
         display: flex; align-items: center; padding: 0 64px; box-sizing: border-box; gap: 56px; }
  .left { flex: 0 0 500px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 110px; height: 110px; margin-left: -14px; }
  .brand span { font-size: 58px; font-weight: 900; letter-spacing: -1px; }
  h1 { font-size: 64px; line-height: 1.02; margin: 18px 0 20px; font-weight: 900; }
  h1 em { font-style: normal; color: #1c7f8d; }
  p { font-size: 25px; font-weight: 700; color: #5b7479; margin: 0; line-height: 1.35; }
  .right { flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .row { background: #fff; border: 4px solid #16323a; border-radius: 16px; padding: 14px 20px; }
  .src { font-size: 21px; color: #5b7479; font-weight: 700; font-family: "Yu Gothic UI", "Microsoft YaHei UI", "Nunito", sans-serif; }
  .dst { font-size: 27px; margin-top: 2px; font-weight: 800; }
  .tag { float: right; font-size: 16px; color: #5b7479; font-weight: 800; margin-top: 4px; }
  .tag i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../docs/logo.png" alt=""><span>Polyglass</span></div>
    <h1>Any Language.<br><em>Any Place.</em></h1>
    <p>Translate the text on your Windows screen, right where it is. Free, open source, fully offline.</p>
  </div>
  <div class="right">
    <div class="row"><span class="tag"><i style="background:#e5392f"></i>Game</span><div class="src">冒険を始めますか？</div><div class="dst">Start your adventure?</div></div>
    <div class="row"><span class="tag"><i style="background:#2272d6"></i>Video</span><div class="src">¿Dónde está la estación de tren?</div><div class="dst">Where's the train station?</div></div>
    <div class="row"><span class="tag"><i style="background:#ffcd2e"></i>PDF</span><div class="src">净利润创历史新高</div><div class="dst">Net profits are at a record high.</div></div>
  </div>
</body></html>
